  <path d="M13.8 28v-4.4h4.4V28" stroke="#ffffff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="42" y="26.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing="-0.4" fill="#15171b">Your Shop</text>
