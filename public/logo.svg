<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" role="img" aria-label="Logo">
  <!--
    PLACEHOLDER LOGO — replace this file with your own.

    Keep the viewBox roughly 4.5:1 and the artwork inside a 40px-tall band; the
    header renders it at height 28px and lets the width follow. An SVG stays
    crisp at any size, but a PNG at 3x (540x120) works too — just rename it and
    update the <img src> in app/[slug]/layout.tsx.
  -->
  <rect x="0" y="4" width="32" height="32" rx="9" fill="#1c4b36" />
  <!-- Awning -->
